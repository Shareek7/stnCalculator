<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Marks & Grade Calculator</title>
  <style>
    :root {
      --bg: #eef2f7;
      --card: #ffffff;
      --text: #1b2430;
      --muted: #5b6776;
      --border: #d5dce6;
      --primary: #144272;
      --primary-hover: #0e3159;
      --accent: #2b6cb0;
      --head-bg: #f1f5fa;
      --error: #c0392b;
      --success: #1e7e46;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    body {
      background: linear-gradient(160deg, #e6edf6 0%, #f6f8fb 60%);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: var(--card);
      width: 100%;
      max-width: 460px;
      padding: 32px 28px;
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 30px rgba(20, 66, 114, 0.1);
    }

    h1 {
      text-align: center;
      font-size: 1.6rem;
      line-height: 1.3;
      margin-bottom: 6px;
      color: var(--primary);
    }

    .subtitle {
      text-align: center;
      font-size: 0.92rem;
      color: var(--muted);
      margin-bottom: 26px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .bold-label,
    .section-label {
      display: block;
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 8px;
    }

    input[type="text"],
    input[type="number"] {
      width: 100%;
      padding: 10px 12px;
      font-size: 1rem;
      color: var(--text);
      background: #fff;
      border: 1px solid #bfc8d4;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input[type="text"]:focus,
    input[type="number"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(43, 108, 176, 0.18);
    }

    input.invalid {
      border-color: var(--error);
      box-shadow: 0 0 0 3px rgba(192, 57, 43, 0.15);
    }

    /* Gender & course options as selectable pills */
    .options-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .option-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.95rem;
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: 999px;
      cursor: pointer;
      background: #fafbfd;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .option-label:hover {
      background: var(--head-bg);
    }

    .option-label:has(input:checked) {
      border-color: var(--accent);
      background: #e8f1fb;
    }

    input[type="radio"],
    input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    /* Table */
    .table-wrap {
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .marks-table {
      width: 100%;
      border-collapse: collapse;
    }

    .marks-table th,
    .marks-table td {
      padding: 12px 10px;
      text-align: left;
      font-size: 0.95rem;
      border-bottom: 1px solid #e6ebf1;
    }

    .marks-table thead th {
      background: var(--head-bg);
      font-weight: 700;
    }

    .marks-table tbody tr:last-child td {
      border-bottom: none;
    }

    .marks-table td:last-child,
    .marks-table th:last-child {
      text-align: center;
      width: 80px;
    }

    .marks-table input[type="number"] {
      padding: 8px 10px;
      font-size: 0.95rem;
    }

    .average-row td {
      background: var(--head-bg);
      font-weight: 700;
    }

    /* Grade badges */
    .grade {
      display: inline-block;
      min-width: 34px;
      padding: 3px 0;
      border-radius: 6px;
      font-weight: 700;
      text-align: center;
      color: var(--muted);
    }

    .grade-A { background: #dff3e6; color: #1e7e46; }
    .grade-B { background: #dfeefb; color: #1a5f9e; }
    .grade-C { background: #fdf2d3; color: #8a6410; }
    .grade-D { background: #fde6d2; color: #a4510f; }
    .grade-F { background: #fbdcd8; color: #b0291b; }

    /* Buttons */
    .button-group {
      display: flex;
      justify-content: center;
      gap: 14px;
    }

    .btn {
      flex: 1;
      max-width: 170px;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      border: 1px solid var(--primary);
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: #fff;
      color: var(--primary);
      border: 1px solid var(--primary);
    }

    .btn-secondary:hover {
      background: var(--head-bg);
    }

    .btn:focus-visible {
      outline: 3px solid rgba(43, 108, 176, 0.4);
      outline-offset: 2px;
    }

    /* Status message */
    .status-message {
      margin-top: 18px;
      min-height: 1.4em;
      text-align: center;
      font-weight: 600;
      font-size: 1rem;
      line-height: 1.4;
      color: var(--success);
    }

    .status-message.error {
      color: var(--error);
    }

    @media (max-width: 420px) {
      .card { padding: 24px 16px; }
      h1 { font-size: 1.4rem; }
      .marks-table th,
      .marks-table td { padding: 10px 6px; }
    }
  </style>
</head>
<body>

  <div id="calculatorPage" class="card">
    <h1>Student Marks &amp; Grade<br>Calculator</h1>
    <p class="subtitle">Enter marks out of 100 to get grades and the average.</p>

    <form id="gradeForm" novalidate>
      <div class="form-group">
        <label for="studentName" class="bold-label">Name</label>
        <input type="text" id="studentName" placeholder="Enter student name" autocomplete="off">
      </div>

      <div class="form-group">
        <span class="section-label">Gender</span>
        <div class="options-group">
          <label class="option-label">
            <input type="radio" name="gender" value="Male" checked> Male
          </label>
          <label class="option-label">
            <input type="radio" name="gender" value="Female"> Female
          </label>
        </div>
      </div>

      <div class="form-group">
        <span class="section-label">Course</span>
        <div class="options-group">
          <label class="option-label">
            <input type="checkbox" name="course" value="HNDIT"> HNDIT
          </label>
          <label class="option-label">
            <input type="checkbox" name="course" value="HNDSE"> HNDSE
          </label>
          <label class="option-label">
            <input type="checkbox" name="course" value="HNDJA"> HNDJA
          </label>
        </div>
      </div>

      <div class="table-wrap">
        <table class="marks-table">
          <thead>
            <tr>
              <th>Subject</th>
              <th>Marks (0–100)</th>
              <th>Grade</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Machine Learning</td>
              <td><input type="number" id="mlMarks" min="0" max="100" placeholder="0-100"></td>
              <td id="mlGrade"><span class="grade">-</span></td>
            </tr>
            <tr>
              <td>Computer Network</td>
              <td><input type="number" id="cnMarks" min="0" max="100" placeholder="0-100"></td>
              <td id="cnGrade"><span class="grade">-</span></td>
            </tr>
            <tr>
              <td>Architecture</td>
              <td><input type="number" id="archMarks" min="0" max="100" placeholder="0-100"></td>
              <td id="archGrade"><span class="grade">-</span></td>
            </tr>
            <tr class="average-row">
              <td colspan="2">Average</td>
              <td id="averageMarks">-</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="button-group">
        <button type="button" id="calculateBtn" class="btn btn-primary">Calculate</button>
        <button type="button" id="resetBtn" class="btn btn-secondary">Reset</button>
      </div>

      <p id="statusMessage" class="status-message" role="status" aria-live="polite"></p>
    </form>
  </div>

  <script>
    const nameInput = document.getElementById("studentName");
    const statusMessage = document.getElementById("statusMessage");
    const markInputs = [
      { input: document.getElementById("mlMarks"), grade: document.getElementById("mlGrade") },
      { input: document.getElementById("cnMarks"), grade: document.getElementById("cnGrade") },
      { input: document.getElementById("archMarks"), grade: document.getElementById("archGrade") }
    ];
    const averageCell = document.getElementById("averageMarks");

    // Determine grade based on marks (0 - 100)
    function getGrade(marks) {
      if (marks >= 75) return "A";
      if (marks >= 60) return "B";
      if (marks >= 45) return "C";
      if (marks >= 30) return "D";
      return "F";
    }

    function setGradeCell(cell, grade) {
      cell.innerHTML = grade
        ? `<span class="grade grade-${grade}">${grade}</span>`
        : `<span class="grade">-</span>`;
    }

    function showMessage(text, isError) {
      statusMessage.textContent = text;
      statusMessage.classList.toggle("error", Boolean(isError));
    }

    function calculate() {
      markInputs.forEach(({ input }) => input.classList.remove("invalid"));
      nameInput.classList.remove("invalid");

      const name = nameInput.value.trim();
      if (!name) {
        nameInput.classList.add("invalid");
        nameInput.focus();
        showMessage("Please enter the student’s name.", true);
        return;
      }

      // Every mark must be a number from 0 to 100
      let total = 0;
      for (const { input } of markInputs) {
        const value = parseFloat(input.value);
        if (input.value === "" || isNaN(value) || value < 0 || value > 100) {
          input.classList.add("invalid");
          input.focus();
          showMessage("Marks must be numbers between 0 and 100.", true);
          return;
        }
        total += value;
      }

      markInputs.forEach(({ input, grade }) => {
        setGradeCell(grade, getGrade(parseFloat(input.value)));
      });

      averageCell.textContent = (total / markInputs.length).toFixed(2);
      showMessage(`${name}’s results calculated successfully.`, false);
    }

    function resetForm() {
      document.getElementById("gradeForm").reset();   // clears name, marks, courses; gender back to Male
      markInputs.forEach(({ input, grade }) => {
        input.classList.remove("invalid");
        setGradeCell(grade, null);
      });
      nameInput.classList.remove("invalid");
      averageCell.textContent = "-";
      showMessage("", false);
      nameInput.focus();
    }

    document.getElementById("calculateBtn").addEventListener("click", calculate);
    document.getElementById("resetBtn").addEventListener("click", resetForm);

    // Clear the old message when the name changes
    nameInput.addEventListener("input", () => showMessage("", false));
  </script>

</body>
</html>
